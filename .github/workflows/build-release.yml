name: 🚀 Build Multi-Platform Installers

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g., 3.4.0)'
        required: true
        default: '3.4.4'

jobs:
  build-windows:
    name: 🪟 Windows Installer
    runs-on: windows-latest
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
      
      - name: ☕ Setup Java 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'maven'
      
      - name: 🛠️ Install Inno Setup
        run: |
          choco install innosetup -y
          Write-Host "✅ Inno Setup installé"
        shell: pwsh
      
      - name: 📝 Create api-keys.properties
        run: |
          Copy-Item api-keys.properties.template api-keys.properties
          Write-Host "✅ api-keys.properties créé depuis template"
        shell: pwsh
      
      - name: 🔨 Build with Maven
        run: mvn clean package -DskipTests "-Dskip.build.increment=true"
        shell: pwsh
      
      - name: 📦 Create Windows Installer
        run: .\build-installer.ps1
        shell: pwsh
      
      - name: 📊 Calculate SHA256
        id: sha256
        run: |
          $hash = (Get-FileHash target\installer\EditeurPanovisu-Setup-*.exe -Algorithm SHA256).Hash
          echo "HASH=$hash" >> $env:GITHUB_OUTPUT
        shell: pwsh
      
      - name: 📤 Upload Windows Installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: target/installer/*.exe
          retention-days: 30

  build-macos:
    name: 🍎 macOS Installer
    runs-on: macos-latest
    
    steps:
      - name: � Configure Git for macOS
        run: |
          git config --global core.quotePath false
          git config --global core.precomposeUnicode true
      
      - name: 📥 Checkout code (avec gestion erreurs encodage)
        uses: actions/checkout@v4
        continue-on-error: true
      
      - name: 🧹 Nettoyer fichiers problématiques
        run: |
          # Supprimer les fichiers avec encodage invalide s'ils existent
          rm -f wiki/Configuration-avanc*.md wiki/D*marrage-rapide.md 2>/dev/null || true
          echo "✅ Fichiers problématiques nettoyés"
      
      - name: ☕ Setup Java 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'maven'
      
      - name: � Create api-keys.properties
        run: |
          cp api-keys.properties.template api-keys.properties
          echo "✅ api-keys.properties créé depuis template"
      
      - name: �️ Convert icon to .icns
        run: |
          # Créer l'icône macOS si elle n'existe pas
          if [ ! -f "images/panovisu.icns" ]; then
            echo "⚠️  Icône .icns manquante, création d'un placeholder"
            # On utilise l'icône PNG comme fallback
            cp images/panovisu.png images/panovisu.icns || true
          fi
      
      - name: 🔨 Build with Maven
        run: mvn clean package -DskipTests -Dskip.build.increment=true
      
      - name: 📦 Create macOS DMG
        run: |
          # Trouver le nom exact du JAR
          MAIN_JAR=$(ls target/editeurPanovisu-*.jar | xargs basename)
          echo "📦 JAR trouvé: $MAIN_JAR"
          
          # Version déduite du nom du JAR (source unique de vérité : pom.xml),
          # comme le font déjà build-installer.ps1 et create-linux-portable.sh.
          # Replis successifs : entrée manuelle du workflow, puis nom du tag.
          APP_VERSION="${MAIN_JAR#editeurPanovisu-}"
          APP_VERSION="${APP_VERSION%.jar}"
          if [ -z "$APP_VERSION" ]; then
            APP_VERSION="${{ github.event.inputs.version }}"
          fi
          if [ -z "$APP_VERSION" ]; then
            APP_VERSION="${GITHUB_REF_NAME#v}"
          fi
          # jpackage refuse un suffixe non numérique dans --app-version
          APP_VERSION="${APP_VERSION%-SNAPSHOT}"
          echo "🏷️  Version appliquée au DMG : $APP_VERSION"
          
          jpackage \
            --type dmg \
            --name EditeurPanovisu \
            --app-version "$APP_VERSION" \
            --vendor "PanoVisu" \
            --input target \
            --main-jar "$MAIN_JAR" \
            --main-class editeurpanovisu.EditeurPanovisu \
            --runtime-image "$JAVA_HOME" \
            --dest target/installer \
            --mac-package-name EditeurPanovisu \
            --mac-package-identifier fr.panovisu.editeur \
            --java-options "-Xmx2048m" \
            --java-options "-Dfile.encoding=UTF-8" \
            --verbose || {
              echo "❌ Erreur jpackage, essai sans icône..."
              jpackage \
                --type dmg \
                --name EditeurPanovisu \
                --app-version "$APP_VERSION" \
                --vendor "PanoVisu" \
                --input target \
                --main-jar "$MAIN_JAR" \
                --main-class editeurpanovisu.EditeurPanovisu \
                --runtime-image "$JAVA_HOME" \
                --dest target/installer \
                --mac-package-name EditeurPanovisu \
                --mac-package-identifier fr.panovisu.editeur \
                --java-options "-Xmx2048m" \
                --java-options "-Dfile.encoding=UTF-8"
            }
      
      - name: 📊 Calculate SHA256
        id: sha256
        run: |
          HASH=$(shasum -a 256 target/installer/*.dmg | cut -d ' ' -f 1)
          echo "HASH=$HASH" >> $GITHUB_OUTPUT
      
      - name: 📤 Upload macOS Installer
        uses: actions/upload-artifact@v4
        with:
          name: macos-installer
          path: target/installer/*.dmg
          retention-days: 30

  build-linux-portable:
    name: 🐧 Linux Portable Archive
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
      
      - name: ☕ Setup Java 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'maven'
      
      - name: � Install Build Dependencies
        run: |
          sudo apt update
          sudo apt install -y zip intel-opencl-icd ocl-icd-opencl-dev
          # Créer le lien symbolique pour libOpenCL.so
          sudo ln -sf /usr/lib/x86_64-linux-gnu/libOpenCL.so.1 /usr/lib/x86_64-linux-gnu/libOpenCL.so
          echo "✅ Dépendances Linux installées"
      
      - name: 📝 Create api-keys.properties
        run: |
          cp api-keys.properties.template api-keys.properties
          echo "✅ api-keys.properties créé depuis template"
      
      - name: 🔨 Build with Maven (portable profile)
        run: mvn clean package -DskipTests "-Dskip.build.increment=true" -Pportable
      
      - name: 📦 Create Linux Portable Archive
        run: |
          chmod +x create-linux-portable.sh
          ./create-linux-portable.sh
          echo "✅ Archives Linux portables créées"
      
      - name: 📊 Calculate SHA256
        id: sha256
        run: |
          ZIP_HASH=$(sha256sum target/EditeurPanovisu-Linux-Portable-*.zip | cut -d' ' -f1)
          TAR_HASH=$(sha256sum target/EditeurPanovisu-Linux-Portable-*.tar.gz | cut -d' ' -f1)
          echo "ZIP_HASH=$ZIP_HASH" >> $GITHUB_OUTPUT
          echo "TAR_HASH=$TAR_HASH" >> $GITHUB_OUTPUT
          echo "📊 Checksums calculés: ZIP=$ZIP_HASH, TAR=$TAR_HASH"
      
      - name: 📤 Upload Linux Portable Archives
        uses: actions/upload-artifact@v4
        with:
          name: linux-portable
          path: |
            target/EditeurPanovisu-Linux-Portable-*.zip
            target/EditeurPanovisu-Linux-Portable-*.tar.gz
          retention-days: 30

  create-release:
    name: 🎉 Create GitHub Release
    needs: [build-windows, build-macos, build-linux-portable]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    
    permissions:
      contents: write
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
      
      - name: 📥 Download Windows Installer
        uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: ./artifacts/windows
      
      - name: 📥 Download macOS Installer
        uses: actions/download-artifact@v4
        with:
          name: macos-installer
          path: ./artifacts/macos
      
      - name: 📥 Download Linux Portable Archive
        uses: actions/download-artifact@v4
        with:
          name: linux-portable
          path: ./artifacts/linux-portable
      
      - name: �📊 Generate checksums
        id: checksums
        run: |
          echo "# 📊 SHA256 Checksums" > checksums.txt
          echo "" >> checksums.txt
          
          for file in artifacts/**/*; do
            if [ -f "$file" ]; then
              HASH=$(sha256sum "$file" | cut -d ' ' -f 1)
              FILENAME=$(basename "$file")
              echo "$HASH  $FILENAME" >> checksums.txt
            fi
          done
          
          cat checksums.txt
      
      - name: 📝 Extract build number and version
        id: build_info
        run: |
          # Extraire le numéro de build depuis le fichier Java Properties
          BUILD_NUM=$(grep '^build\.number=' build.num 2>/dev/null | cut -d'=' -f2 || echo "unknown")
          echo "BUILD_NUM=$BUILD_NUM" >> $GITHUB_OUTPUT
          echo "✅ Build number: $BUILD_NUM"
          
          # Déterminer la version (depuis le tag ou depuis l'input)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="v${{ github.event.inputs.version }}"
          else
            VERSION="${{ github.ref_name }}"
          fi
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "✅ Version: $VERSION"
          
          # Lire les notes de release depuis le fichier RELEASE_NOTES_vX.Y.Z.md
          RELEASE_FILE="RELEASE_NOTES_${VERSION}.md"
          if [ -f "$RELEASE_FILE" ]; then
            echo "✅ Fichier de release trouvé: $RELEASE_FILE"
            # Encoder pour GitHub Output (multiline)
            NOTES=$(cat "$RELEASE_FILE")
          else
            echo "⚠️  Fichier $RELEASE_FILE non trouvé, utilisation du message par défaut"
            NOTES="## EditeurPanovisu ${VERSION}\n\nVoir RELEASE_NOTES_${VERSION}.md pour le détail des changements."
          fi
          # Écriture sécurisée du contenu multiline dans GitHub Output
          {
            echo 'RELEASE_NOTES<<RELEASE_EOF'
            cat "$RELEASE_FILE" 2>/dev/null || echo "$NOTES"
            echo 'RELEASE_EOF'
          } >> $GITHUB_OUTPUT
      
      - name: 🎉 Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.build_info.outputs.VERSION }}
          name: "EditeurPanovisu ${{ steps.build_info.outputs.VERSION }} - Build ${{ steps.build_info.outputs.BUILD_NUM }}"
          body: ${{ steps.build_info.outputs.RELEASE_NOTES }}
          files: |
            artifacts/windows/*
            artifacts/macos/*
            artifacts/linux-portable/*
            checksums.txt
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  notify-summary:
    name: 📊 Build Summary
    needs: [build-windows, build-macos, build-linux-portable]
    runs-on: ubuntu-latest
    
    steps:
      - name: 📊 Generate Summary
        run: |
          echo "# 🎉 Build Multi-Platform Completed!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ **Windows** installer created" >> $GITHUB_STEP_SUMMARY
          echo "✅ **macOS** installer created" >> $GITHUB_STEP_SUMMARY
          echo "✅ **Linux** portable archives created (ZIP + TAR.GZ)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📦 All artifacts ready for download!" >> $GITHUB_STEP_SUMMARY


